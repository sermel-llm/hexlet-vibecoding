<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор калорий</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#16a34a;--border:#e5e7eb;--p:#3b82f6;--f:#f59e0b;--c:#10b981}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--text:#e8eaed;--muted:#9aa3ae;--border:#2c333c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);cursor:pointer;font-size:15px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.full{grid-column:1/-1}
.err{color:#dc2626;font-size:14px;min-height:20px;margin-top:8px}
.big{font-size:44px;font-weight:700;color:var(--accent);line-height:1.1}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:13px;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:16px 0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@media (max-width:480px){.row{grid-template-columns:1fr}.big{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Калькулятор калорий</h1>
  <p class="sub">Суточная норма по формуле Миффлина — Сан Жеора с учётом активности и цели.</p>

  <div class="card">
    <div class="grid">
      <div class="full">
        <label>Пол</label>
        <div class="seg" id="sex">
          <button data-v="m" class="on">Мужской</button>
          <button data-v="f">Женский</button>
        </div>
      </div>
      <div><label for="age">Возраст, лет</label><input id="age" type="number" min="14" max="100" value="30"></div>
      <div><label for="height">Рост, см</label><input id="height" type="number" min="120" max="230" value="175"></div>
      <div><label for="weight">Вес, кг</label><input id="weight" type="number" min="35" max="250" step="0.1" value="75"></div>
      <div class="full">
        <label for="activity">Активность</label>
        <select id="activity">
          <option value="1.2">Минимальная — сидячий образ жизни</option>
          <option value="1.375">Низкая — тренировки 1–3 раза в неделю</option>
          <option value="1.55" selected>Средняя — 3–5 раз в неделю</option>
          <option value="1.725">Высокая — 6–7 раз в неделю</option>
          <option value="1.9">Очень высокая — физическая работа + спорт</option>
        </select>
      </div>
      <div class="full">
        <label>Цель</label>
        <div class="seg" id="goal">
          <button data-v="-0.15">Похудение</button>
          <button data-v="0" class="on">Поддержание</button>
          <button data-v="0.15">Набор массы</button>
        </div>
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card" id="result">
    <label>Ваша суточная норма</label>
    <div class="big"><span id="kcal">—</span> ккал</div>
    <div class="row">
      <div class="stat"><b id="bmr">—</b><span>Базовый обмен</span></div>
      <div class="stat"><b id="tdee">—</b><span>С учётом активности</span></div>
      <div class="stat"><b id="bmi">—</b><span id="bmiTxt">ИМТ</span></div>
    </div>
    <div class="bar">
      <div id="bp" style="background:var(--p)"></div>
      <div id="bf" style="background:var(--f)"></div>
      <div id="bc" style="background:var(--c)"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--p)"></i>Белки: <b id="p">—</b> г</span>
      <span><i class="dot" style="background:var(--f)"></i>Жиры: <b id="f">—</b> г</span>
      <span><i class="dot" style="background:var(--c)"></i>Углеводы: <b id="c">—</b> г</span>
    </div>
    <p class="note">Расчёт ориентировочный. При заболеваниях, беременности или спортивных целях проконсультируйтесь со специалистом.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = { sex: 'm', goal: 0 };

document.querySelectorAll('.seg').forEach(seg => {
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    state[seg.id] = seg.id === 'goal' ? parseFloat(b.dataset.v) : b.dataset.v;
    calc();
  });
});
['age','height','weight','activity'].forEach(id => $(id).addEventListener('input', calc));

function calc() {
  const age = +$('age').value, h = +$('height').value, w = +$('weight').value, act = +$('activity').value;
  const bad = !(age >= 14 && age <= 100) ? 'Возраст: от 14 до 100 лет'
            : !(h >= 120 && h <= 230) ? 'Рост: от 120 до 230 см'
            : !(w >= 35 && w <= 250) ? 'Вес: от 35 до 250 кг' : '';
  $('err').textContent = bad;
  $('result').style.opacity = bad ? .4 : 1;
  if (bad) return;

  const bmr = 10 * w + 6.25 * h - 5 * age + (state.sex === 'm' ? 5 : -161);
  const tdee = bmr * act;
  const kcal = Math.round(tdee * (1 + state.goal));

  // БЖУ: белок г/кг по цели, жиры 1 г/кг (min 25% ккал), остальное — углеводы
  const pPerKg = state.goal < 0 ? 2 : state.goal > 0 ? 1.8 : 1.6;
  const p = Math.round(w * pPerKg);
  const f = Math.round(Math.max(w * 0.9, kcal * 0.25 / 9));
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));

  const bmi = w / (h / 100) ** 2;
  const bmiTxt = bmi < 18.5 ? 'ИМТ · дефицит' : bmi < 25 ? 'ИМТ · норма' : bmi < 30 ? 'ИМТ · избыток' : 'ИМТ · ожирение';

  $('kcal').textContent = kcal.toLocaleString('ru');
  $('bmr').textContent = Math.round(bmr).toLocaleString('ru');
  $('tdee').textContent = Math.round(tdee).toLocaleString('ru');
  $('bmi').textContent = bmi.toFixed(1);
  $('bmiTxt').textContent = bmiTxt;
  $('p').textContent = p; $('f').textContent = f; $('c').textContent = c;
  const tot = p * 4 + f * 9 + c * 4;
  $('bp').style.width = (p * 4 / tot * 100) + '%';
  $('bf').style.width = (f * 9 / tot * 100) + '%';
  $('bc').style.width = (c * 4 / tot * 100) + '%';
}
calc();
</script>
</body>
</html>
